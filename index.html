<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Singularity Inc.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%2300e436'/%3E%3Crect x='2' y='2' width='1' height='1'/%3E%3Crect x='5' y='2' width='1' height='1'/%3E%3Crect x='2' y='5' width='4' height='1'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo">
        <div class="logo-face"><i></i><i></i><b></b></div>
        <div class="logo-text">SINGULARITY<br /><span>INC.</span></div>
      </div>
      <div id="stats"></div>
      <div class="spacer"></div>
      <div id="era-label">
        <div class="px-label" id="era-count">ÄRA 1 / 6</div>
        <div id="era-name">GARAGE</div>
      </div>
      <div class="menu">
        <button id="btn-sound" class="icon-btn" title="Ton an/aus">♪</button>
        <button id="btn-menu" class="icon-btn" title="Menü">≡</button>
      </div>
    </header>

    <main id="main">
      <section id="left"></section>
      <section id="center">
        <div id="scene-wrap">
          <canvas id="scene"></canvas>
          <div id="floaters"></div>
          <div id="golden-layer"></div>
        </div>
        <div id="bottom">
          <div class="card" id="chart-card">
            <div class="card-head"><span class="px-label" id="chart-title">INTELLIGENZ (LOG)</span><span id="chart-legend"></span></div>
            <canvas id="chart"></canvas>
          </div>
          <div class="card" id="rsi-card"></div>
        </div>
      </section>
      <section id="right">
        <div id="tabs"></div>
        <div id="amount"></div>
        <div id="shop"></div>
      </section>
    </main>

    <footer id="ticker"><div class="ticker-tag" id="ticker-tag">+++ EILMELDUNG +++</div><div id="ticker-track"><div id="ticker-text"></div></div></footer>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
